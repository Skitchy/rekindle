    <polygon points="263,397 314,388 289,438" fill="url(#cyanGrad)"/>
    <path d="M268 365 A180 180 0 0 1 385 50" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4" stroke-linecap="round"/>
    <path d="M223 106 A182 182 0 0 1 346 20" fill="none" stroke="url(#cyanGrad2)" stroke-width="36" stroke-linecap="round" opacity=".95"/>
    <polygon points="384,20 331,28 357,76" fill="url(#cyanGrad2)"/>
  </g>
  <g stroke="#224A57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".95">
    <path d="M147 255 H208 L245 229 H303"/>
    <path d="M166 303 H235 L270 276 H337"/>
    <path d="M185 348 H259 L296 322 H368"/>
    <path d="M230 190 H273 L307 164 H347"/>
    <path d="M259 147 H306"/>
  </g>
  <g fill="#0B161C" stroke="#3D8DA4" stroke-width="6">
    <circle cx="133" cy="255" r="12"/>
    <circle cx="153" cy="303" r="12"/>
    <circle cx="170" cy="348" r="12"/>
    <circle cx="216" cy="190" r="12"/>
    <circle cx="249" cy="147" r="12"/>
    <circle cx="316" cy="229" r="12"/>
    <circle cx="350" cy="276" r="12"/>
    <circle cx="382" cy="322" r="12"/>
    <circle cx="362" cy="164" r="12"/>
    <circle cx="322" cy="147" r="12"/>
  </g>
</g>
</g>
<g id="wordmark" transform="translate(-210,24)">
  <text x="755" y="280" font-family="Orbitron, Eurostile, Bank Gothic, Montserrat, Arial, sans-serif" font-size="106" font-weight="700" letter-spacing="14" fill="url(#wordGrad)">REKINDLE</text>
  <line x1="760" y1="362" x2="975" y2="362" stroke="#2C94AF" stroke-width="4" opacity=".85"/>
  <text x="1020" y="382" font-family="Orbitron, Eurostile, Bank Gothic, Montserrat, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="12" fill="url(#mcpGrad)">MCP</text>
  <line x1="1192" y1="362" x2="1410" y2="362" stroke="#2C94AF" stroke-width="4" opacity=".85"/>
  <text x="781" y="470" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="7" fill="url(#tagGrad)" opacity=".95">CAPTURE TODAY. REMEMBER TOMORROW.</text>
</g>
</svg>
