    <path d="M176 360 C150 309, 154 254, 176 211 C188 187, 205 166, 217 141 C225 123, 231 107, 234 90 C247 109, 255 131, 258 157 C270 134, 288 115, 308 99 C306 123, 307 149, 316 173 C326 161, 338 146, 352 134 C354 157, 353 179, 346 201 C337 228, 319 249, 294 264 C267 280, 244 302, 228 330 C221 342, 216 357, 214 372 C205 360, 196 348, 188 336 C185 344, 181 352, 176 360 Z" fill="url(#fireGrad2)" opacity=".92"/>
    <path d="M224 354 C214 315, 225 275, 247 244 C259 228, 273 214, 284 195 C295 177, 303 159, 305 140 C316 159, 321 182, 320 206 C333 189, 347 175, 362 165 C361 185, 357 202, 349 219 C339 241, 321 257, 300 271 C280 285, 261 303, 248 324 C240 335, 232 345, 224 354 Z" fill="#FFB24A" opacity=".22"/>
  </g>
  <g filter="url(#glowCyan)">
